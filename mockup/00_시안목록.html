<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>ReFind 화면 시안 v2 목록</title>
<link rel="stylesheet" href="refind.css?v=20261109"><script src="shell.js?v=20261109"></script><script src="interact.js?v=20261109"></script>
<style>
  .list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .it{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none;color:var(--txt)}
  .it:hover{border-color:var(--acc)}
  .it b{font-size:15px}
  .it .v{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .it .v a{font-size:11.5px;color:var(--acc);border:1px solid var(--line2);border-radius:5px;padding:2px 8px;text-decoration:none}
</style></head>
<body><aside class="side"></aside>
<main><header class="top"></header>
<section class="content">
  <div class="ptitle"><div><h1>ReFind 화면 시안 v2</h1><p>v2: 사건 등록 이후 단계를 지도 중심 한 화면으로 합친 시안입니다. (기존 단계별 시안은 ReFind_화면시안 폴더에 그대로 있습니다.) 버튼·탭·슬라이더 등이 실제로 동작합니다. 각 화면은 1440×900 기준입니다.</p></div></div>
  <div class="card pad" style="display:flex;align-items:center;gap:14px">
    <div class="grow"><b style="font-size:15px">시연 데이터</b><div class="cap" style="margin-top:3px">진행 상황(확정·부재·알림 확인·종결)은 이 브라우저에 저장되어 화면 사이에 이어집니다. 처음 상태로 되돌리려면 아래 버튼을 누르세요.</div>
      <div class="cap" id="state" style="margin-top:6px;color:var(--acc)"></div></div>
    <button class="btn" id="r-demo">${''}진행된 사건으로 초기화</button><button class="btn pri" id="r-fresh">새 사건부터 시작</button></div>
  <div class="list" id="list"></div>
</section></main>
<script>
shell('list', { title: '화면 시안 목록', meta: '사건 목록 · B-2 ~ B-8' });
const showState = () => { const S = Store.get(); document.getElementById('state').textContent = `현재 저장 상태 · ${S.case.no} · 확정 ${S.confirmed.length} · 부재 ${S.absent.length} · 알림 ${S.alerts.length} · ${S.closed ? '종결됨' : '진행 중'}`; };
showState();
document.getElementById('r-demo').textContent = '진행된 사건으로 초기화';
document.getElementById('r-demo').onclick = () => { Store.reset(false); showState(); toast('진행된 사건(확정 4·임시 1·부재 1·알림 1) 상태로 되돌렸습니다.'); };
document.getElementById('r-fresh').onclick = () => { Store.reset(true); sessionStorage.removeItem('refind-draft'); location.href = '04_case_new.html?step=1'; };
const L = [
  ['B-1','사건 목록','진입 화면 · 사건 선택, 미확인 출현 알림, 환경 설정 상태','01_cases.html',[]],
  ['B-2','지도·카메라 배치','S1 · 카메라, 도보 경로 보정, 위험지역','02_camera.html',[['카메라','?tab=cam'],['도보 경로','?tab=route'],['위험지역','?tab=danger']]],
  ['B-3','영상 등록 및 분석 진행','S1 · 입력 검증, 진행률, 실패·재시도, 커버리지','03_video.html',[]],
  ['B-4','사건 등록 및 대상 선택','S2 시작 · 3단계 스테퍼','04_case_new.html',[['1 사건 정보','?step=1'],['2 영상 속 인물','?step=2&mode=video'],['2 사진 업로드','?step=2&mode=photo'],['3 확인','?step=3']]],
  ['B-5~8','사건 수색 (지도 중심 통합)','후보 확인 · 동선 · 수색·감시를 지도 한 화면에서 · 카메라·후보·장면을 누르면 지도 위에 영상 · 사건 종결 포함','05_workspace.html',[['후보 확인','?mode=cand'],['동선','?mode=route'],['수색·감시','?mode=search']]],
  ['Part C','전체 화면 흐름도','S1 → S2 → S3 · 판단 분기와 반복 흐름 (1680×1060)','08_flow.html',[]],
];
document.getElementById('list').innerHTML = L.map(([id,n,d,h,v]) => `<div class="it"><span class="cap">${id}</span><a href="${h}" style="color:var(--txt);text-decoration:none"><b>${n}</b></a><span class="cap">${d}</span>
  <div class="v">${(v.length?v:[['열기','']]).map(([a,q])=>`<a href="${h.split('?')[0]}${q|| (h.includes('?')?'?'+h.split('?')[1]:'')}">${a}</a>`).join('')}</div></div>`).join('');
</script></body></html>
